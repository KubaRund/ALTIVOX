<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 780 350" role="img"><title>Výpočet hmotnosti a objemu z hustoty</title><rect width="780" height="350" rx="24" fill="#f7f8f1"/><g font-family="Arial,sans-serif" font-size="19" fill="#173f32"><rect x="130" y="100" width="160" height="130" rx="15" fill="#d9e8de"/><rect x="470" y="100" width="160" height="130" rx="15" fill="#bacac1"/><text x="150" y="80">Stejný objem V</text><text x="490" y="80">Stejný objem V</text><text x="130" y="275">Menší hmotnost → menší ρ</text><text x="445" y="275">Větší hmotnost → větší ρ</text><text x="300" y="325">ρ = m / V</text></g></svg>